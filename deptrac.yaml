deptrac:
  paths:
    - ./src
  layers:
    - name: Core
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Core(\\|$)/'
    - name: Scheduling
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Scheduling(\\|$)/'
    - name: Application
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Application(\\|$)/'
    - name: Auth
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Auth(\\|$)/'
    - name: Database
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Database(\\|$)/'
    - name: Journal
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Journal(\\|$)/'
    - name: Execution
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Execution(\\|$)/'
    - name: Transport
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Transport(\\|$)/'
    - name: Outcome
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Outcome(\\|$)/'
    - name: Status
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Status(\\|$)/'
    - name: OperationData
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\OperationData(\\|$)/'
    - name: Http
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Http(\\|$)/'
    - name: Logging
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Logging(\\|$)/'
    - name: Console
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Console(\\|$)/'
    - name: StorageProtection
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\StorageProtection(\\|$)/'
    - name: Identifier
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Identifier(\\|$)/'
    - name: Idempotency
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Idempotency(\\|$)/'
    - name: Outbox
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Outbox(\\|$)/'
    - name: Telemetry
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Telemetry(\\|$)/'
    - name: Observability
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Observability(\\|$)/'
    - name: Internal
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal(?!(?:\\Application|\\Auth|\\Http|\\Idempotency|\\Telemetry|\\StorageProtection)(?:\\|$)|\\Runtime\\FrankenPhp(?:\\|$)|\\Execution\\DeferredOperationContextValidator$).*/'
    - name: InternalApplication
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Application(\\|$)/'
    - name: InternalAuth
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Auth(\\|$)/'
    - name: InternalHttp
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Http(\\|$)/'
    - name: InternalIdempotency
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Idempotency(\\|$)/'
    - name: InternalSapiRuntime
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Runtime\\FrankenPhp(\\|$)/'
    - name: InternalTelemetry
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Telemetry(\\|$)/'
    - name: InternalStorageProtection
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\StorageProtection(\\|$)/'
    - name: DeferredIntegrity
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal\\Execution\\DeferredOperationContextValidator$/'
    - name: Library
      collectors:
        - type: classNameRegex
          value: '/^Monolog(\\|$)/'
        - type: classNameRegex
          value: '/^FastRoute(\\|$)/'
        - type: classNameRegex
          value: '/^Doctrine\\DBAL(\\|$)/'
        - type: classNameRegex
          value: '/^Doctrine\\Migrations(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Clock(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Cache(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Container(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Http(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Log(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Console(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\DependencyInjection(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Stopwatch(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Uid(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Validator(\\|$)/'
        - type: classNameRegex
          value: '/^OpenTelemetry(\\|$)/'
        - type: classNameRegex
          value: '/^Dotenv(\\|$)/'
        - type: classNameRegex
          value: '/^Nyholm(\\|$)/'
  ruleset:
    Core:
      - Telemetry
      - Idempotency
    Identifier:
      - Core
    Idempotency:
      - Core
    Outbox:
      - Core
    Scheduling:
      - Core
    Application:
      - Core
      - InternalApplication
      - Library
    Auth:
      - Core
      - Http
      - InternalAuth
      - Library
    Database:
      - Core
      - Library
    Journal:
      - Core
      - Telemetry
    Execution:
      - Core
      - Journal
      - Telemetry
      - Idempotency
    Transport:
      - Core
      - Journal
      - Execution
      - Outcome
      - Library
      - Telemetry
      - StorageProtection
      - InternalStorageProtection
      - DeferredIntegrity
    Outcome:
      - Core
    Status:
      - Core
    OperationData:
      - Core
      - Journal
      - Outcome
    Http:
      - Core
      - Observability
      - Application
      - Execution
      - InternalHttp
      - InternalIdempotency
      - InternalSapiRuntime
      - Outcome
      - Status
      - Library
      - Telemetry
      - Idempotency
    Logging:
      - Core
      - Journal
      - Library
    Console:
      - Core
      - Observability
      - Journal
      - Execution
      - Transport
      - Library
    StorageProtection:
      - Core
    Telemetry:
      - Core
      - Library
    Observability:
      - Core
      - Library
    Internal:
      - Core
      - Scheduling
      - Journal
      - Execution
      - Transport
      - Http
      - Logging
      - Console
      - Outcome
      - Status
      - OperationData
      - Database
      - Auth
      - StorageProtection
      - Observability
      - Library
      - Telemetry
      - InternalTelemetry
      - InternalStorageProtection
      - DeferredIntegrity
      - Identifier
      - Idempotency
      - Outbox
      - InternalApplication
      - InternalHttp
      - InternalIdempotency
    InternalApplication:
      - Core
      - Database
      - Execution
      - Http
      - Internal
      - InternalHttp
      - InternalIdempotency
      - InternalStorageProtection
      - InternalTelemetry
      - Journal
      - Library
      - Logging
      - OperationData
      - Outbox
      - Scheduling
      - StorageProtection
      - Transport
    InternalAuth:
      - Auth
      - Core
      - Database
      - Library
    InternalHttp:
      - Core
      - Http
      - Idempotency
      - Internal
      - InternalIdempotency
      - InternalTelemetry
      - Library
      - Status
      - Telemetry
    InternalIdempotency:
      - Core
      - Http
      - Idempotency
      - Internal
      - InternalStorageProtection
      - Journal
      - Library
      - StorageProtection
      - Transport
    InternalSapiRuntime:
      - Library
    InternalTelemetry:
      - Core
      - Telemetry
      - Library
    InternalStorageProtection:
      - Core
      - StorageProtection
      - InternalTelemetry
    DeferredIntegrity:
      - Core
