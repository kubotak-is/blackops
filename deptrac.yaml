deptrac:
  paths:
    - ./src
  layers:
    - name: Core
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Core(\\|$)/'
    - name: Scheduling
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Scheduling(\\|$)/'
    - name: Application
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Application(\\|$)/'
    - name: Auth
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Auth(\\|$)/'
    - name: Database
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Database(\\|$)/'
    - name: Journal
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Journal(\\|$)/'
    - name: Execution
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Execution(\\|$)/'
    - name: Transport
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Transport(\\|$)/'
    - name: Outcome
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Outcome(\\|$)/'
    - name: Status
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Status(\\|$)/'
    - name: OperationData
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\OperationData(\\|$)/'
    - name: Http
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Http(\\|$)/'
    - name: Logging
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Logging(\\|$)/'
    - name: Console
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Console(\\|$)/'
    - name: StorageProtection
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\StorageProtection(\\|$)/'
    - name: Telemetry
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Telemetry(\\|$)/'
    - name: Observability
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Observability(\\|$)/'
    - name: Internal
      collectors:
        - type: classNameRegex
          value: '/^BlackOps\\Internal(\\|$)/'
    - name: Library
      collectors:
        - type: classNameRegex
          value: '/^Monolog(\\|$)/'
        - type: classNameRegex
          value: '/^FastRoute(\\|$)/'
        - type: classNameRegex
          value: '/^Doctrine\\DBAL(\\|$)/'
        - type: classNameRegex
          value: '/^Doctrine\\Migrations(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Clock(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Cache(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Container(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Http(\\|$)/'
        - type: classNameRegex
          value: '/^Psr\\Log(\\|$)/'
        - type: classNameRegex
          value: '/^Ray\\Aop(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Console(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\DependencyInjection(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Stopwatch(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Uid(\\|$)/'
        - type: classNameRegex
          value: '/^Symfony\\Component\\Validator(\\|$)/'
        - type: classNameRegex
          value: '/^OpenTelemetry(\\|$)/'
  ruleset:
    Core:
      - Telemetry
    Scheduling:
      - Core
    Application:
      - Core
      - Internal
      - Library
    Auth:
      - Core
      - Http
      - Internal
      - Library
    Database:
      - Core
      - Library
    Journal:
      - Core
    Execution:
      - Core
      - Journal
    Transport:
      - Core
      - Journal
      - Execution
      - Outcome
      - Library
    Outcome:
      - Core
    Status:
      - Core
    OperationData:
      - Core
      - Journal
      - Outcome
    Http:
      - Core
      - Observability
      - Application
      - Execution
      - Internal
      - Outcome
      - Status
      - Library
    Logging:
      - Core
      - Journal
      - Library
    Console:
      - Core
      - Observability
      - Journal
      - Execution
      - Transport
      - Library
    StorageProtection:
      - Core
    Telemetry:
      - Core
      - Library
    Observability:
      - Core
      - Library
    Internal:
      - Core
      - Scheduling
      - Journal
      - Execution
      - Transport
      - Http
      - Logging
      - Console
      - Outcome
      - Status
      - OperationData
      - Database
      - Auth
      - StorageProtection
      - Observability
      - Library
